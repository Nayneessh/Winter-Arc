name: Build Winter Arc APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :core holds every calculation and the whole model, and is pure Kotlin/JVM. Running it
      # first means a logic regression fails in seconds rather than after an APK assembly.
      - name: Run core tests
        run: ./gradlew :core:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      # A green compile is not the same as an installable artifact, so each archive is opened
      # and checked for the two things that make it an APK at all.
      - name: Verify the APKs
        run: |
          set -euo pipefail
          found=0
          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            found=1
            size=$(du -h "$apk" | cut -f1)
            echo "- \`$apk\` ($size)" >> "$GITHUB_STEP_SUMMARY"
            unzip -l "$apk" | grep -q AndroidManifest.xml || { echo "No manifest in $apk"; exit 1; }
            unzip -l "$apk" | grep -q classes.dex || { echo "No dex in $apk"; exit 1; }
          done
          if [ "$found" -eq 0 ]; then echo "No APKs were produced."; exit 1; fi
          echo "APK structure verified."

      # GitHub stores workflow artifacts on a host some networks cannot reach, and an artifact
      # zip is awkward to hand to someone. The APKs are also pushed to an orphan branch, which
      # is recreated from scratch each run so it holds exactly one copy of each and no history.
      - name: Publish APKs to the apk branch
        if: success()
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          find app/build/outputs/apk -name "*.apk" -exec cp {} "$staging"/ \;
          ls -la "$staging"
          cat > "$staging/README.md" <<EOF
          # Winter Arc — built APKs

          Built from \`${GITHUB_SHA}\` by run \`${GITHUB_RUN_ID}\`.

          Install \`app-debug.apk\`. It is not minified, so a crash gives a readable stack
          trace, and its application id is \`com.winterarc.app.debug\`, so it can sit alongside
          a release build.
          EOF
          git -C "$staging" init -q -b apk
          git -C "$staging" add -A
          git -C "$staging" commit -q -m "APKs from ${GITHUB_SHA}"
          git -C "$staging" push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/build/reports/tests/
          retention-days: 14
          if-no-files-found: warn
