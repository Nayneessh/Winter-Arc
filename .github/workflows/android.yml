name: Build Winter Arc APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # The domain module is pure Kotlin/JVM and holds every piece of business logic:
      # volume, estimated 1RM, PR detection, plan-vs-actual reconciliation, streaks.
      # Running it first means a logic regression fails the build before we spend time
      # assembling an APK.
      - name: Run domain unit tests
        run: ./gradlew :core:domain:test --stacktrace

      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Report APK details
        run: |
          echo "### APKs built" >> "$GITHUB_STEP_SUMMARY"
          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            size=$(du -h "$apk" | cut -f1)
            echo "- \`$apk\` ($size)" >> "$GITHUB_STEP_SUMMARY"
          done
          # Confirm the archive is a well-formed APK with a manifest and dex, rather than
          # trusting that a green build means an installable artifact.
          for apk in $(find app/build/outputs/apk -name "*.apk"); do
            echo "Verifying $apk"
            unzip -l "$apk" | grep -q AndroidManifest.xml || { echo "No manifest in $apk"; exit 1; }
            unzip -l "$apk" | grep -q classes.dex || { echo "No dex in $apk"; exit 1; }
          done
          echo "APK structure verified."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            core/domain/build/reports/tests/
            app/build/reports/
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: winter-arc-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
